<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account — CertFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container" style="max-width:480px;padding-top:10vh">
    <div class="header"><div class="brand"><span class="brand-icon">⬡</span><span class="brand-name">CertFlow</span></div><p class="tagline">Create your account</p></div>
    <section class="section">
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('signup') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="control-group">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="40"
                 pattern="[A-Za-z0-9._\-]+" title="3–40 chars: letters, numbers, dots, hyphens, underscores"
                 value="{{ username or '' }}">
          <span style="font-size:11px;color:var(--text-muted);margin-top:4px;display:block">3–40 characters. Letters, numbers, <code>.</code> <code>-</code> <code>_</code> allowed.</span>
        </div>
        <div class="control-group" style="margin-top:12px">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
          <span style="font-size:11px;color:var(--text-muted);margin-top:4px;display:block">At least 8 characters.</span>
        </div>
        <div class="control-group" style="margin-top:12px">
          <label for="confirm_password">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="8">
        </div>
        <button class="btn btn-primary" type="submit" style="margin-top:18px;width:100%">Create account</button>
      </form>
      <p style="margin-top:16px;text-align:center;font-size:13px;color:var(--text-secondary)">
        Already have an account? <a href="{{ url_for('login') }}" style="color:var(--primary);text-decoration:none;font-weight:500">Sign in</a>
      </p>
    </section>
  </main>
</body>
</html>

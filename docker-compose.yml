services:
  # ── Redis: shared rate-limit store across all Gunicorn workers ────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # ── App security (values come from .env, populated by scripts/server-setup.sh)
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}

      # ── Admin credentials ──────────────────────────────────────────
      # To generate a new hash: python3 -c "from argon2 import PasswordHasher; print(PasswordHasher().hash('NewPassword'))"
      # Then update via: bash scripts/update-secrets.sh
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}

      # ── Throttled mailer (Step 6) ────────────────────────────────────
      MAILER_SECRET: ${MAILER_SECRET:-}

      # ── Session / cookie hardening ─────────────────────────────────
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Strict}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-28800}

      # ── Rate limiting ───────────────────────────────────────────────
      GLOBAL_RATE_LIMIT: ${GLOBAL_RATE_LIMIT:-200 per hour}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5 per minute}
      RATELIMIT_STORAGE_URI: "redis://redis:6379"

      # ── Upload / generation limits ──────────────────────────────────
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-33554432}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
      MAX_CSV_ROWS: ${MAX_CSV_ROWS:-2000}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-2000}
      MAX_ZIP_ENTRIES: ${MAX_ZIP_ENTRIES:-500}
      MAX_NAME_LENGTH: ${MAX_NAME_LENGTH:-200}

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-certflow.duckdns.org}
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:

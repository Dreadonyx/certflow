services:
  # ── Redis: shared rate-limit store across all Gunicorn workers ────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # ── App security ────────────────────────────────────────────────
      FLASK_ENV: production
      SECRET_KEY: ba83d2949026e5b24b55bac62136de361a9184e408820204d772cacd4b8cc6b7

      # ── Admin credentials ──────────────────────────────────────────
      # Password is stored as an Argon2id hash (Admin@123).
      # To change: python3 -c "from argon2 import PasswordHasher; print(PasswordHasher().hash('NewPassword'))"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: "$$argon2id$$v=19$$m=65536,t=3,p=4$$KWGmoIpwKwAUdSYbCgIGUA$$bgcSv96TZHac5LvK1SDyFARlcewGJeJYzexYR4bs1tQ"

      # ── Session / cookie hardening ─────────────────────────────────
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: Strict
      SESSION_LIFETIME_SECONDS: "28800"   # 8 hours

      # ── Rate limiting ───────────────────────────────────────────────
      # Shared across ALL workers via Redis — limits are strictly per-IP.
      GLOBAL_RATE_LIMIT: "200 per hour"
      LOGIN_RATE_LIMIT: "5 per minute"
      RATELIMIT_STORAGE_URI: "redis://redis:6379"

      # ── Upload / generation limits ──────────────────────────────────
      MAX_REQUEST_BYTES: "33554432"   # 32 MB
      MAX_IMAGE_BYTES: "10485760"     # 10 MB per image
      MAX_IMAGE_PIXELS: "25000000"
      MAX_CSV_ROWS: "2000"
      MAX_PARTICIPANTS: "2000"
      MAX_ZIP_ENTRIES: "500"
      MAX_NAME_LENGTH: "200"

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-certflow.duckdns.org}
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
